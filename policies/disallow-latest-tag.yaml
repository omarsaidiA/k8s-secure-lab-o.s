apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow the latest tag
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      ":latest" (or no tag at all) points to a different image over time: deployments are not
      reproducible and a compromised upstream image is pulled silently.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno, local-path-storage]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    # A digest (@sha256:...), or a tag after the last "/" (so "registry:5000/app" has no tag)
    - expression: >-
        variables.containers.all(c,
          (c.image.matches('@sha256:[a-f0-9]{64}$') || c.image.matches(':[^:/]+$'))
          && !c.image.endsWith(':latest'))
      message: "Images must use an explicit tag or digest, and never ':latest'."
