apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-service-account-token
  annotations:
    policies.kyverno.io/title: Do not mount Kubernetes API tokens
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      By default every pod receives a token for the Kubernetes API. None of these workloads
      needs it, and a stolen token is a common first step to move laterally in a cluster.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno, local-path-storage]
  validations:
    - expression: object.spec.?automountServiceAccountToken.orValue(true) == false
      message: "Pods must set automountServiceAccountToken: false."
