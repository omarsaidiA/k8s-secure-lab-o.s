apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Only images from an allow-list may run: the official PostgreSQL image, Keycloak's own
      registry, and images built locally from this lab (lab.local/). Anything else, such as an
      arbitrary Docker Hub image, is rejected.
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno, local-path-storage]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('lab.local/')
          || c.image.startsWith('quay.io/keycloak/')
          || c.image.matches('^(docker\\.io/(library/)?)?postgres:[^/]+$'))
      message: "Images must come from an allowed source: postgres, quay.io/keycloak/ or lab.local/."
